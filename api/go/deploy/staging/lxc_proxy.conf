map $http_upgrade $trmm_upgrade { default upgrade; '' close; }
server {
 listen 80;
 server_name api2.q-dt.de rmm2.q-dt.de mesh2.q-dt.de;
 return 301 https://$host$request_uri;
}
server {
 listen 443 ssl;
 server_name rmm2.q-dt.de;
 ssl_certificate /etc/trmm-tls/fullchain.pem;
 ssl_certificate_key /etc/trmm-tls/privkey.pem;
 root /opt/trmm/frontend;
 index index.html;
 add_header X-Robots-Tag "noindex, nofollow" always;
 location = /env-config.js { add_header Cache-Control "no-store"; }
 location / { try_files $uri $uri/ /index.html; }
}
server {
 listen 443 ssl;
 server_name api2.q-dt.de;
 ssl_certificate /etc/trmm-tls/fullchain.pem;
 ssl_certificate_key /etc/trmm-tls/privkey.pem;
 client_max_body_size 4m;
 add_header X-Robots-Tag "noindex, nofollow" always;
 location /natsws {
  proxy_pass http://127.0.0.1:9236;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $trmm_upgrade;
  proxy_set_header Host $host;
  proxy_read_timeout 3600s;
 }
 location /ws/ {
  proxy_pass http://127.0.0.1:18082;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $trmm_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 3600s;
  proxy_next_upstream off;
  access_log off;
 }
 location / {
  proxy_pass http://127.0.0.1:18082;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 200s;
  proxy_next_upstream off;
 }
}
server {
 listen 443 ssl;
 server_name mesh2.q-dt.de;
 ssl_certificate /etc/trmm-tls/fullchain.pem;
 ssl_certificate_key /etc/trmm-tls/privkey.pem;
 add_header Content-Security-Policy "frame-ancestors 'self' https://rmm2.q-dt.de" always;
 add_header X-Robots-Tag "noindex, nofollow" always;
 location / {
  proxy_pass http://127.0.0.1:14430;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $trmm_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 3600s;
  proxy_buffering off;
 }
}
