name: Build QDT Virtual Display Driver

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/qdt-virtual-display/**"
      - ".github/workflows/virtual-display-driver.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Verify source invariants
        shell: pwsh
        run: windows/qdt-virtual-display/verify.ps1

      - name: Build x64 Release driver
        shell: pwsh
        run: msbuild windows/qdt-virtual-display/QdtVirtualDisplay.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off

      - name: Create and validate driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'driver-package'
          New-Item -ItemType Directory -Path $package | Out-Null
          $dll = Get-ChildItem windows/qdt-virtual-display -Recurse -Filter QdtVirtualDisplay.dll | Where-Object FullName -Match 'Release' | Select-Object -First 1
          if (-not $dll) { throw 'Release driver DLL was not produced' }
          Copy-Item $dll.FullName, windows/qdt-virtual-display/QdtVirtualDisplay.inf -Destination $package
          $infverif = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter InfVerif.exe | Where-Object FullName -NotMatch '\\arm64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          $inf2cat = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter Inf2Cat.exe | Where-Object FullName -NotMatch '\\arm64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $infverif -or -not $inf2cat) { throw 'WDK validation tools are missing' }
          & $infverif.FullName /w (Join-Path $package 'QdtVirtualDisplay.inf')
          if ($LASTEXITCODE) { throw "InfVerif failed with exit code $LASTEXITCODE" }
          & $inf2cat.FullName /driver:$package /os:10_X64
          if ($LASTEXITCODE) { throw "Inf2Cat failed with exit code $LASTEXITCODE" }
          Get-ChildItem $package | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: qdt-virtual-display-x64-unsigned
          path: driver-package/
          if-no-files-found: error
          retention-days: 7
